<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Bengazy Arts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 6px }
    </style>
</head>
<body class="bg-light text-dark font-sans">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-serif font-bold">Artist Admin Panel</h1>
            <a href="index.html" class="text-secondary hover:text-accent">Back to Site</a>
        </div>

        <!-- Login Card -->
        <div id="loginCard" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
            <h2 class="font-bold mb-4">Admin Login</h2>
            <p class="text-sm text-gray-600 mb-4">Enter the admin password to manage gallery and tutorials.</p>
            <div class="mb-3">
                <input id="loginPassword" type="password" placeholder="Password" class="w-full px-3 py-2 border rounded" />
            </div>
            <div class="flex gap-2">
                <button id="loginBtn" class="bg-secondary text-white py-2 px-4 rounded">Login to Admin</button>
                <button id="useDefaultBtn" class="bg-gray-200 py-2 px-4 rounded">Use Default</button>
            </div>
        </div>

        <div id="adminPanel" style="display:none">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="font-bold mb-4">Add New Artwork</h2>
                <form id="artworkForm">
                    <div class="mb-3">
                        <label class="block mb-1">Title</label>
                        <input id="title" class="w-full px-3 py-2 border rounded" required />
                    </div>
                    <div class="mb-3">
                        <label class="block mb-1">Artist</label>
                        <input id="artist" class="w-full px-3 py-2 border rounded" value="Bengazy" />
                    </div>
                    <div class="mb-3">
                        <label class="block mb-1">Short Description / Notes</label>
                        <textarea id="description" class="w-full px-3 py-2 border rounded"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="block mb-1">Price</label>
                        <input id="price" type="number" class="w-full px-3 py-2 border rounded" />
                    </div>
                    <div class="mb-3">
                        <label class="block mb-1">Cover Image</label>
                        <input id="cover" type="file" accept="image/*" />
                        <div class="mt-2"><img id="coverPreview" src="" alt="preview" class="thumb hidden" /></div>
                    </div>
                    <div class="mb-3">
                        <label class="block mb-1">Progress Images (multiple)</label>
                        <input id="progress" type="file" accept="image/*" multiple />
                    </div>
                    <div class="flex gap-2">
                        <button class="bg-secondary text-white py-2 px-4 rounded" type="submit">Save Artwork</button>
                        <button id="clearStore" type="button" class="bg-gray-200 py-2 px-4 rounded">Clear All</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="font-bold mb-4">Manage Artworks</h2>
                <div id="artworkList" class="space-y-4"></div>
            </div>
        </div>

            <div class="mt-6">
                <details class="bg-white p-4 rounded shadow">
                    <summary class="font-semibold cursor-pointer">Change Password / Logout</summary>
                    <div class="mt-3 grid grid-cols-1 gap-3">
                        <input id="oldPassword" type="password" placeholder="Current password" class="px-3 py-2 border rounded" />
                        <input id="newPassword" type="password" placeholder="New password" class="px-3 py-2 border rounded" />
                        <div class="flex gap-2">
                            <button id="changePassword" class="bg-secondary text-white py-2 px-4 rounded">Change Password</button>
                            <button id="logoutBtn" class="bg-gray-200 py-2 px-4 rounded">Logout</button>
                        </div>
                        <p class="text-xs text-gray-500">Default password on first run is <strong>admin123</strong>. Change it for security.</p>
                    </div>
                </details>
            </div>

        <div class="mt-8 bg-white p-6 rounded-lg shadow">
            <h2 class="font-bold mb-4">Tutorial Videos</h2>
            <form id="tutorialForm" class="flex flex-col gap-3">
                <input id="tutorialTitle" placeholder="Title" class="px-3 py-2 border rounded" />
                <input id="tutorialURL" placeholder="Video or social link (YouTube, Vimeo, Instagram)" class="px-3 py-2 border rounded" />
                <div class="flex gap-2">
                    <button class="bg-secondary text-white py-2 px-4 rounded" type="submit">Save Link</button>
                    <button id="clearTutorials" type="button" class="bg-gray-200 py-2 px-4 rounded">Clear Tutorials</button>
                </div>
            </form>
            <div id="tutorialList" class="mt-4"></div>
        </div>
        </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
